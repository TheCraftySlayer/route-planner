<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f4f9;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5em;
            color: #333;
            text-align: center;
        }

        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 700px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label {
            font-size: 1.1em;
            margin-bottom: 10px;
            color: #333;
            width: 100%;
            text-align: left;
        }

        input[type="file"], input[type="email"], textarea {
            font-size: 1em;
            margin-bottom: 20px;
            padding: 12px;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            margin-bottom: 10px;
            width: 100%;
        }

        button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        .garage-buttons {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
        }

        .garage-buttons button {
            flex: 1;
            margin: 0 5px;
        }

        #routeLinks, #routeStats {
            margin-top: 20px;
            font-weight: bold;
            width: 100%;
            text-align: left;
        }

        #map {
            width: 100%;
            height: 500px;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
        }

        .route-info {
            margin-bottom: 10px;
        }

        #upcCountDisplay {
            font-size: 1.2em;
            color: #333;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Route Planner</h1>
    <div class="container">
        <label>Select Parking Garage:</label>
        <div class="garage-buttons">
            <button class="garage-button" data-lat="35.08563" data-lng="-106.65205">400-498 Copper Ave NW</button>
            <button class="garage-button" data-lat="35.08302" data-lng="-106.65312">222 5th St SW</button>
        </div>
        <label for="coordinatesFile">Upload Coordinates Dataset:</label>
        <input type="file" id="coordinatesFile" accept=".xlsx">
        <label for="upcInput">Enter UPCs (comma or newline separated):</label>
        <textarea id="upcInput" placeholder="Enter UPCs"></textarea>
        <button id="generateRoute">Generate Route from UPCs</button>
        <button id="resetRoute" disabled>Reset Route</button>
        <button id="exportRoutes" disabled>Export Routes</button>
        <label for="emailAddress">Enter Email Address:</label>
        <input type="email" id="emailAddress" placeholder="Enter email address">
        <button id="sendEmail" disabled>Send Route Link via Email</button>
        <div id="routeStats"></div>
        <div id="routeLinks"></div>
        <div id="upcCountDisplay">UPC Count: 0</div>
    </div>
    <div id="map"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <script>
        function loadGoogleMapsAPI() {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=AIzaSyBK6fgLO9KXHhXq4q3bl4G-tUQ2IyyQrhY&callback=initMap`;
                script.async = true;
                script.defer = true;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        loadGoogleMapsAPI().then(() => {
            console.log('Google Maps API loaded successfully');
        }).catch((error) => {
            console.error('Error loading Google Maps API:', error);
        });
    </script>
    <script src="script_initialization.js"></script>
    <script src="script_event_listeners.js"></script>
    <script src="script_utility_functions.js"></script>
</body>
</html>
